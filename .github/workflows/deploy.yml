name: Deploy VICIdial-FIVE

on:
  push:
    branches:
      - develop
      - main

jobs:

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Check PHP syntax
        run: |
          ERROR=0
          for file in $(find . -name "*.php"); do
            php -l "$file" > /dev/null 2>&1 || { echo "❌ Error en: $file"; ERROR=1; }
          done
          if [ $ERROR -eq 0 ]; then echo "✅ Todos los archivos PHP son válidos"; fi
          exit $ERROR

  deploy-staging:
    needs: syntax-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: vici.softvici.cloud
          username: root
          password: ${{ secrets.VPS_STAGING_PASSWORD }}
          source: ".,!.git,!.github,!*.sql,!E1ziEw4nqWSKvA7MczOXvBMe924FCbvg"
          target: /srv/www/htdocs
          rm: false

      - name: Verify deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: vici.softvici.cloud
          username: root
          password: ${{ secrets.VPS_STAGING_PASSWORD }}
          script: |
            echo "✅ Deploy staging completado"
            echo "🕐 $(date)"

  deploy-production:
    needs: syntax-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_PROD_HOST }}
          username: root
          password: ${{ secrets.VPS_PROD_PASSWORD }}
          source: ".,!.git,!.github,!*.sql,!E1ziEw4nqWSKvA7MczOXvBMe924FCbvg"
          target: /srv/www/htdocs
          rm: false

      - name: Verify deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_PROD_HOST }}
          username: root
          password: ${{ secrets.VPS_PROD_PASSWORD }}
          script: |
            echo "✅ Deploy producción completado"
            echo "🕐 $(date)"